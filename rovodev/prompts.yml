prompts:
  - name: address-comments
    description: "Look at PR review comments and robustly address legitimate ones, ignore noise"
    content_file: prompts/address-comments/SKILL.md
    inputs:
      - name: pr_target
        label: PR number or URL
        description: PR number or URL to address comments on. Leave empty to use the current branch's PR.
        type: string
        required: false

  - name: apply-changes
    description: "Implement requested changes with surgical precision"
    content_file: prompts/apply-changes/SKILL.md
    inputs:
      - name: changes
        label: Changes to apply
        description: Describe the changes to apply. Leave empty to apply changes from conversation context.
        type: string
        required: false

  - name: clean-up-feature-flag
    description: "Remove a fully rolled out feature flag and verify checks pass"
    content_file: prompts/clean-up-feature-flag/SKILL.md
    inputs:
      - name: flag_key
        label: Flag key
        description: The feature flag key to remove.
        type: string
        required: true

  - name: describe-branch
    description: "Generate a Conventional Commits PR title and description"
    content_file: prompts/describe-branch/SKILL.md

  - name: describe-diff
    description: "Generate a ≤10 word phrase summarizing working changes"
    content_file: prompts/describe-diff/SKILL.md

  - name: fix-failures
    description: "Run build/test, fix failures without workarounds or suppressing errors"
    content_file: prompts/fix-failures/SKILL.md
    inputs:
      - name: error_output
        label: Error output or stack trace
        description: Paste error output or stack trace to fix. Leave empty to run the build and test suite to discover failures.
        type: string
        required: false

  - name: git-commit-push-to-origin
    description: "Stage changes, commit with a Conventional Commits message, push to origin, and create or report the PR"
    content_file: prompts/git-commit-push-to-origin/SKILL.md

  - name: git-commit-push
    description: "Stage changes, commit with a Conventional Commits message, push, and create or report the PR"
    content_file: prompts/git-commit-push/SKILL.md

  - name: review-tests
    description: "Review and strengthen tests in a branch for depth, mutation resilience, and correctness"
    content_file: prompts/review-tests/SKILL.md
    inputs:
      - name: focus_area
        label: Focus area
        description: Optional text to narrow the review to specific tests or areas. Leave empty to review all tests in the branch.
        type: string
        required: false

  - name: create-spec
    description: "Author a tight technical spec plus chunky implementation plan for execute-spec — no fluff, no filler"
    content_file: prompts/create-spec/SKILL.md
    inputs:
      - name: topic
        label: Topic or seed
        description: One-line feature/topic, a problem statement, or a path to seed notes (e.g. `.plan/seed/foo.md`). Leave empty to infer from conversation context.
        type: string
        required: false
      - name: out_path
        label: Output path
        description: Optional override for where the spec is written. Leave empty to auto-pick (`.plan/specs/`, `.plan/changes/<slug>/design.md`, or `docs/specs/` based on what already exists in the repo).
        type: string
        required: false

  - name: execute-spec
    description: "Execute a spec or plan end-to-end as substantial production-grade work, with canonical patterns and robust verification"
    content_file: prompts/execute-spec/SKILL.md
    inputs:
      - name: spec
        label: Spec or plan
        description: Path to a spec/plan file (e.g. `.plan/foo.md`, `.projects/bar.md`), a plan name to resolve under those directories, or the inline spec text. Leave empty to discover the most recent plan in `.plan` or `.projects`.
        type: string
        required: false

  - name: resolve-conflict
    description: "Resolve merge conflicts preserving branch intent"
    content_file: prompts/resolve-conflict/SKILL.md

  - name: review-branch
    description: "Review for bugs, security, architecture, and test coverage (no style nits)"
    content_file: prompts/review-branch/SKILL.md
    inputs:
      - name: focus_area
        label: Focus area
        description: Optional text to narrow the review scope. Leave empty to review the entire branch.
        type: string
        required: false

  - name: ship-next-chunk
    description: "Pick the next chunk from the spec/plan and implement it end-to-end on a fresh branch, ready for git-commit-push"
    content_file: prompts/ship-next-chunk/SKILL.md
    inputs:
      - name: focus
        label: Focus or spec
        description: Optional spec text or focus for the next chunk. Leave empty to discover the spec from the repo or conversation.
        type: string
        required: false

  - name: sync-main
    description: "Fetch latest main and merge it into the current branch"
    content_file: prompts/sync-main/SKILL.md

  - name: write-up
    description: "Document the preceding discussion as clear, fact-checked prose in chat"
    content_file: prompts/write-up/SKILL.md
    inputs:
      - name: focus
        label: Focus or angle
        description: Optional aspect of the discussion to emphasize. Leave empty to cover the whole discussion.
        type: string
        required: false

  - name: grill-me
    description: "Interview the user relentlessly about a plan or design until reaching shared understanding, resolving each branch of the decision tree"
    content_file: prompts/grill-me/SKILL.md
    inputs:
      - name: plan
        label: Plan or design
        description: Inline plan/design text, a file path (e.g. `.plan/foo.md`), or leave empty to infer from conversation context.
        type: string
        required: false
