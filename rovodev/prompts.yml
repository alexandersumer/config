prompts:
  - name: address-comments
    description: "Address actionable pull request review comments with minimal code changes; skip subjective feedback"
    content_file: prompts/address-comments/SKILL.md
    inputs:
      - name: pr_target
        label: Pull request number or URL
        description: Pull request number or URL to address comments on. Leave empty to use the current branch's pull request.
        type: string
        required: false
      - name: focus
        label: Focus or instructions
        description: Optional focus area or extra instructions for which comments to address.
        type: string
        required: false

  - name: apply-changes
    description: "Implement requested changes narrowly and consistently"
    content_file: prompts/apply-changes/SKILL.md
    inputs:
      - name: changes
        label: Changes to apply
        description: Describe the changes to apply. Leave empty to apply changes from conversation context.
        type: string
        required: false

  - name: clean-up-feature-flag
    description: "Remove a fully rolled out feature flag and verify checks pass"
    content_file: prompts/clean-up-feature-flag/SKILL.md
    inputs:
      - name: flag_key
        label: Flag key
        description: The feature flag key to remove.
        type: string
        required: true

  - name: describe-branch
    description: "Generate a Conventional Commits pull request title and description"
    content_file: prompts/describe-branch/SKILL.md

  - name: describe-diff
    description: "Generate a ≤10 word phrase summarizing working changes"
    content_file: prompts/describe-diff/SKILL.md

  - name: desloppify
    description: "Improve code quality with a dependency-free desloppify-style review/fix loop"
    content_file: prompts/desloppify/SKILL.md
    inputs:
      - name: path
        label: Scan path
        description: Directory to scan. Empty or repo-like phrases mean `.`.
        type: string
        required: false

  - name: fix-failures
    description: "Run relevant build/tests and fix real failures without suppressions"
    content_file: prompts/fix-failures/SKILL.md
    inputs:
      - name: error_output
        label: Error output or stack trace
        description: Paste error output or stack trace to fix. Leave empty to run the build and test suite to discover failures.
        type: string
        required: false

  - name: git-publish
    description: "Commit current changes with a conventional commit, push the branch, and create or update the pull request."
    content_file: prompts/git-publish/SKILL.md

  - name: git-publish-to-origin
    description: "Commit current changes with a conventional commit, then push the current branch to origin"
    content_file: prompts/git-publish-to-origin/SKILL.md

  - name: review-tests
    description: "Review and strengthen branch tests for meaningful coverage and regression resistance"
    content_file: prompts/review-tests/SKILL.md
    inputs:
      - name: focus_area
        label: Focus area
        description: Optional text to narrow the review to specific tests or areas. Leave empty to review all tests in the branch.
        type: string
        required: false

  - name: create-spec
    description: "Author a concise planning artifact plus a reviewable implementation plan"
    content_file: prompts/create-spec/SKILL.md
    inputs:
      - name: topic
        label: Topic or seed
        description: One-line feature/topic, problem statement, or path to seed notes/artifact. Leave empty to infer from conversation context.
        type: string
        required: false
      - name: out_path
        label: Output path
        description: Optional override for where the primary planning artifact is written. Leave empty to auto-pick from existing repo artifact conventions.
        type: string
        required: false

  - name: execute-spec
    description: "Implement a planning artifact with repo patterns, tests, and verification"
    content_file: prompts/execute-spec/SKILL.md
    inputs:
      - name: artifact
        label: Planning artifact
        description: Path/name/text for a spec, plan, design, proposal, roadmap, task artifact, or inline instructions. Leave empty to discover the most relevant recent artifact.
        type: string
        required: false
      - name: spec
        label: Planning artifact (legacy alias)
        description: Backward-compatible alias for artifact. Prefer artifact for new usage.
        type: string
        required: false

  - name: reconcile-plan
    description: "Reconcile planning artifacts with current codebase and branch state"
    content_file: prompts/reconcile-plan/SKILL.md
    inputs:
      - name: artifact
        label: Planning artifact
        description: Optional spec, plan, project, task path/name/text, or discovery focus. Leave empty to discover relevant artifacts.
        type: string
        required: false
      - name: scope
        label: Reconciliation scope
        description: Optional code path, branch diff, project root, behavior, or branch/default-branch comparison scope. Leave empty to infer from branch and artifact locality.
        type: string
        required: false

  - name: resolve-conflict
    description: "Resolve merge conflicts preserving branch intent"
    content_file: prompts/resolve-conflict/SKILL.md

  - name: review-branch
    description: "Review a branch for bugs, security issues, architecture risks, and test gaps"
    content_file: prompts/review-branch/SKILL.md
    inputs:
      - name: focus_area
        label: Focus area
        description: Optional text to narrow the review scope. Leave empty to review the entire branch.
        type: string
        required: false

  - name: ship-next-chunk
    description: "Sync to the default branch, choose the next artifact-backed chunk, implement it on a new branch, and leave changes uncommitted"
    content_file: prompts/ship-next-chunk/SKILL.md
    inputs:
      - name: artifact
        label: Project, plan, spec, or artifact
        description: Optional project name, plan/spec/design/proposal/roadmap/task path or text, or focus for the next chunk. Leave empty to infer from repo/context.
        type: string
        required: false
      - name: focus
        label: Project/focus (legacy alias)
        description: Backward-compatible alias for artifact. Prefer artifact for new usage.
        type: string
        required: false
      - name: project_root
        label: Project root path
        description: Optional path that anchors artifact discovery in repos with multiple parallel plans. Leave empty to infer from the just-merged diff.
        type: string
        required: false

  - name: sync-main
    description: "Fetch the latest default branch and merge it into the current branch"
    content_file: prompts/sync-main/SKILL.md

  - name: verify-and-fix
    description: "Verify scoped behavior with code review and targeted checks, then fix real defects"
    content_file: prompts/verify-and-fix/SKILL.md
    inputs:
      - name: scope
        label: Verification scope
        description: Optional path, function, behavior, or planning artifact to verify. Leave empty to infer the scope from conversation, recent changes, or the relevant planning artifact.
        type: string
        required: false

  - name: write-up
    description: "Document the preceding discussion as clear, fact-checked prose in chat"
    content_file: prompts/write-up/SKILL.md
    inputs:
      - name: focus
        label: Focus or angle
        description: Optional aspect of the discussion to emphasize. Leave empty to cover the whole discussion.
        type: string
        required: false

  - name: grill-me
    description: "Stress-test a plan or design with focused questions until the important decisions are clear"
    content_file: prompts/grill-me/SKILL.md
    inputs:
      - name: plan
        label: Plan or design
        description: Inline plan/design text, a file path (e.g. `.plan/foo.md`), or leave empty to infer from conversation context.
        type: string
        required: false
