prompts:
  address-comments:
    inputs:
    - name: pr_target
      label: Pull request number or URL
      description: Pull request number or URL to address comments on. Leave empty
        to use the current branch's pull request.
      type: string
      required: false
    - name: focus
      label: Focus or instructions
      description: Optional focus area or extra instructions for which comments to
        address.
      type: string
      required: false
  surgical-edit:
    inputs:
    - name: changes
      label: Changes to apply
      description: Describe the changes to apply. Leave empty to apply changes from
        conversation context.
      type: string
      required: false
  clean-up-feature-flag:
    inputs:
    - name: flag_key
      label: Flag key
      description: The feature flag key to remove.
      type: string
      required: true
  create-chat-plan:
    inputs:
    - name: topic
      label: Topic or seed
      description: Optional feature, bug, refactor, design, file path, or implementation
        concern to plan in chat. Leave empty to infer from conversation context.
      type: string
      required: false
  create-plan:
    inputs:
    - name: topic
      label: Topic or seed
      description: One-line feature/topic, problem statement, or path to seed notes/artifact.
        Leave empty to infer from conversation context.
      type: string
      required: false
    - name: out_path
      label: Output path
      description: Optional path for the primary artifact. Leave empty to mirror repo
        artifact conventions.
      type: string
      required: false
  review-delegated-design:
    inputs:
    - name: scope
      label: Design scope
      description: Optional design, diff, file, plan, or scope to evaluate. Leave
        empty to infer from conversation or current branch.
      type: string
      required: false
  review-direct-design:
    inputs:
    - name: scope
      label: Design scope
      description: Optional design, diff, file, plan, or scope to evaluate. Leave
        empty to infer from conversation or current branch.
      type: string
      required: false
  execute-plan:
    inputs:
    - name: artifact
      label: Planning artifact
      description: Path/name/text for a spec, plan, design, proposal, roadmap, task
        artifact, or inline instructions. Leave empty to discover the most relevant
        recent artifact.
      type: string
      required: false
    - name: spec
      label: Planning artifact (legacy alias)
      description: Backward-compatible alias for artifact. Prefer artifact for new
        usage.
      type: string
      required: false
  fix-failures:
    inputs:
    - name: error_output
      label: Error output or stack trace
      description: Paste error output or stack trace to fix. Leave empty to inspect
        the current branch's CI/check status first, then fall back to documented local
        checks if needed.
      type: string
      required: false
  grill-me:
    inputs:
    - name: plan
      label: Plan or design
      description: Inline plan/design text, a file path (e.g. `.plan/foo.md`), or
        leave empty to infer from conversation context.
      type: string
      required: false
  prove-check:
    inputs:
    - name: scope
      label: Check scope
      description: Optional check command, behavior, file, or bug class to prove.
        Leave empty to infer from recent changes or conversation context.
      type: string
      required: false
  real-e2e:
    inputs:
    - name: scope
      label: E2E scope
      description: Optional behavior, API, feature, package, or test lane to cover with a true end-to-end test. Leave empty to infer from conversation context.
      type: string
      required: false
  reconcile-plan:
    inputs:
    - name: artifact
      label: Planning artifact
      description: Optional spec, plan, project, task path/name/text, or discovery
        focus. Leave empty to discover relevant artifacts.
      type: string
      required: false
    - name: scope
      label: Reconciliation scope
      description: Optional code path, branch diff, project root, behavior, or branch/default-branch
        comparison scope. Leave empty to infer from branch and artifact locality.
      type: string
      required: false
  review-delegated-branch:
    inputs:
    - name: focus_area
      label: Focus area
      description: Optional text to narrow the review scope. Leave empty to review
        the entire branch.
      type: string
      required: false
  review-delegated-tests:
    inputs:
    - name: focus_area
      label: Focus area
      description: Optional text to narrow the review to specific tests or areas.
        Leave empty to review all tests in the branch.
      type: string
      required: false
  review-direct-branch:
    inputs:
    - name: focus_area
      label: Focus area
      description: Optional text to narrow the review scope. Leave empty to review
        the entire branch.
      type: string
      required: false
  review-direct-tests:
    inputs:
    - name: focus_area
      label: Focus area
      description: Optional text to narrow the review to specific tests or areas.
        Leave empty to review all tests in the branch.
      type: string
      required: false
  ship-next-chunk:
    inputs:
    - name: artifact
      label: Project, plan, spec, or artifact
      description: Optional project name, plan/spec/design/proposal/roadmap/task path
        or text, or focus for the next chunk. Leave empty to infer from repo/context.
      type: string
      required: false
    - name: focus
      label: Project/focus (legacy alias)
      description: Backward-compatible alias for artifact. Prefer artifact for new
        usage.
      type: string
      required: false
    - name: project_root
      label: Project root path
      description: Optional path that anchors artifact discovery in repos with multiple
        parallel plans. Leave empty to infer from the just-merged diff.
      type: string
      required: false
  study-code-atlassian:
    inputs:
    - name: aspect
      label: Aspect to study
      description: Optional aspect, repo, path, pattern, or implementation concern to
        study in ~/atlassian. Leave empty to infer from conversation context.
      type: string
      required: false
  study-code-oss:
    inputs:
    - name: aspect
      label: Aspect to study
      description: Optional aspect, repo, path, pattern, or implementation concern to
        study in ~/oss. Leave empty to infer from conversation context.
      type: string
      required: false
  verify-and-fix:
    inputs:
    - name: scope
      label: Verification scope
      description: Path, function, behavior, or planning artifact to verify. Leave
        empty to infer from conversation, recent changes, or relevant artifact.
      type: string
      required: false
  write-up:
    inputs:
    - name: focus
      label: Focus or angle
      description: Optional aspect of the discussion to emphasize. Leave empty to
        cover the whole discussion.
      type: string
      required: false
