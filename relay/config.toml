[meta]
config_version = 1

[ui]
theme = "catppuccin-mocha"
thread_worktree_location = "relay"
tool_result_preview_lines = 5
thinking_preview_lines = 1
succinct_tool_results = true
color_tool_names = true
color_markdown_headings = false
slash_panel_position = "bottom"
vim_keybindings = false
show_tips = true
agent_summaries = false

[notifications]
enabled = false
volume = 0.5

[logging]
level = "info"

[plugins]
enabled = false
allow_project_plugins = false
paths = []
trusted_workspaces = []
disabled = ["bundled:j-gonzalez"]

[agents]
default = "axiom"

[agents.runners]

[agents.runners.alta]
command = "/opt/atlassian/bin/atlas"
args = ["alta", "agent", "run"]
renderer = "alta"

[agents.runners.axiom]
command = "/opt/atlassian/bin/atlas"
args = ["alta", "agent", "run", "@atlassian/alta-agent-axiom-asumer"]
renderer = "alta"
