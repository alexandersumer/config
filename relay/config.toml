[meta]
config_version = 3

[ui]
theme = "catppuccin-mocha"
thread_worktree_location = "relay"
tool_result_preview_lines = 5
thinking_preview_lines = 1
succinct_tool_results = true
color_tool_names = true
color_markdown_headings = false
slash_panel_position = "bottom"
disabled_builtin_slash_commands = ["review"]
vim_keybindings = false
show_tips = true
terminal_title_prompt_source = "smart"
sticky_prompt_header_lines = 3

[notifications]
terminal_enabled = false
sound_enabled = false
volume = 0

[logging]
level = "info"

[plugins]
enabled = false
allow_project_plugins = false
paths = []
trusted_workspaces = []
disabled = []

[agents]
default = "axiom"

[agents.runners]

[agents.runners.alta]
command = "/opt/atlassian/bin/atlas"
args = ["alta", "agent", "run"]
profile = "alta"

[agents.runners.axiom]
command = "/opt/atlassian/bin/atlas"
args = ["alta", "agent", "run", "@atlassian/alta-agent-axiom-asumer"]
profile = "alta"

[agents.runners.code-agent]
command = "/opt/atlassian/bin/atlas"
args = ["alta", "agent", "run", "code-agent"]
profile = "alta"
